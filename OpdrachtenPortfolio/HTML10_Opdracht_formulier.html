<!DOCTYPE html>
<html>
<head>
    <title>Opdracht 10</title>
    <link rel="stylesheet" href="mijnstijl3.css">
</head>
<body>
    <p>Formulier voor aanbevelingen</p>
    <div class="divBasis">
        <div>
            <label for="naam">StudentNaam</label>
            <input type="text" name="" id="naam">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="" id="email">
        </div>
        <div class="adress">
            <div>
                <label for="adres">Adres</label>
                <input type="text" name="" id="adres">
            </div>
            <div>
                <label for="postcode">Postcode</label>
                <input type="text" name="" id="postcode">
            </div>
            <div>
                <label for="woonplaats">Woonplaats</label>
                <input type="text" name="" id="woonplaats">
            </div>
        </div>
        <div class="checks">
            <div>
                <label for="richting">Richting</label>
                <select id="richting">
                    <option>SD (N4)</option>
                    <option>ICT Beheer (N4)</option>
                    <option>ICT (N3)</option>
                </select>
            </div>
            <div>
                <label for="opleiding">BBL</label>
                <input type="checkbox" id="opleiding" name="opleiding" value="1">
            </div>
        </div>
        <div class="commentaar">
            <label for="commentaar">Aanbevelingen</label>
            <textarea id="commentaar"></textarea>
        </div>
</body>
</html>
