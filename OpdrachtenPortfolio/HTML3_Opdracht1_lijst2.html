<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            width: 100px;
            padding: 10px;
            background-color: #d0e7f9; /* Light blue background */
            border: 2px solid black;   /* Black border */
        }
        ol, ul {
            padding-left: 20px;
        }
    </style>
    <title>Multi-style List</title>
</head>
<body>
    <div class="container">
        <ol reversed>
            <li>Thee</li>
            <li>Melk</li>
            <li>Suiker</li>
        </ol>
        
        <ol type="i" reversed>
            <li>Thee</li>
            <li>Melk</li>
            <li>Suiker</li>
        </ol>

        <ol type="A">
            <li>Thee</li>
            <li>Melk</li>
            <li>Suiker</li>
        </ol>

        <ol start="20">
            <li>Thee</li>
            <li>Melk</li>
            <li>Suiker</li>
        </ol>
    </div>
</body>
</html>
